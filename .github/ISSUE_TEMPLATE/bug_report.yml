name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Language used (Gujarati, Hindi or English), device and browser. Do not paste personal data.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: Unsafe advice?
      description: If an answer contained a dose or a brand name, paste the answer here.
