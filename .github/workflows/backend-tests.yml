name: backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No keys in CI: the model provider is stubbed in the tests.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # A production build must refuse to fall back to localhost.
      - name: build without VITE_API_URL fails
        run: "! npm run build > build.log 2>&1 && grep -q 'VITE_API_URL is not set' build.log"
      - run: npm run build
        env:
          VITE_API_URL: https://kisan-mitra-api.example.org
      - name: bundle never calls localhost
        run: "! grep -rq 'localhost:8000' build"
