name: backend tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: both jobs only read the repository, and neither uses a secret.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No keys in CI: the model provider is stubbed in the tests.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22  # @axe-core/playwright needs >= 22.12; Node 20 is end-of-life
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # A production build must refuse to fall back to localhost.
      - name: build without VITE_API_URL fails
        run: "! npm run build > build.log 2>&1 && grep -q 'VITE_API_URL is not set' build.log"
      - run: npm run build
        env:
          VITE_API_URL: https://kisan-mitra-api.example.org
      - name: bundle never calls localhost
        run: "! grep -rq 'localhost:8000' build"
      # Real browser checks against `vite preview` of the build above; the backend is mocked.
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
