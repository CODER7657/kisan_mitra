name: backend tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: both jobs only read the repository, and neither uses a secret.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: lint (ruff)
        run: ruff check .
      - name: format (ruff)
        run: ruff format --check .
      - name: security lint, high severity (bandit)
        run: bandit -r kisan main.py -lll
      # Known vulnerabilities fail the build, except any listed with a reason in
      # pip-audit-ignore.txt (empty since the pillow 13 / starlette 1.x upgrade).
      - name: dependency vulnerabilities (pip-audit)
        run: |
          mapfile -t ignores < <(sed -n 's/^\([A-Z][A-Za-z0-9-]*\).*/--ignore-vuln\n\1/p' pip-audit-ignore.txt)
          pip-audit -r requirements.txt "${ignores[@]}"
      # No keys in CI: the model provider is stubbed in the tests.
      # The floor is the measured coverage of kisan/ (96.2% on 2026-11-07), rounded down.
      - name: tests with coverage floor
        run: pytest -q --cov=kisan --cov-report=term --cov-fail-under=96

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22  # @axe-core/playwright needs >= 22.12; Node 20 is end-of-life
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Only what ships to the browser; dev tooling advisories are handled by Dependabot.
      - name: dependency vulnerabilities, high and above (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      # A production build must refuse to fall back to localhost.
      - name: build without VITE_API_URL fails
        run: "! npm run build > build.log 2>&1 && grep -q 'VITE_API_URL is not set' build.log"
      - run: npm run build
        env:
          # The production API: e2e/csp.spec.ts checks vercel.json's CSP allows the origin built in.
          VITE_API_URL: https://kisan-mitra-api.vercel.app
      - name: bundle never calls localhost
        run: "! grep -rq 'localhost:8000' build"
      # Real browser checks against `vite preview` of the build above; the backend is mocked.
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
