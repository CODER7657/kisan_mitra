name: mutation testing (guard)

# Weekly mutation testing of the dose/brand guard (backend/kisan/guard.py) with mutmut,
# configured in backend/setup.cfg: each mutant is judged by tests/test_guard.py and
# tests/test_guard_properties.py. Survivors are reported, not failed on; the job fails
# only if the score falls below the floor.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

# Least privilege: reads the repository, uses no secret.
permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Measured 111 of 111 mutants killed (100%) on 2026-11-08; the floor leaves a margin
      # for new code whose first tests miss a mutant, without letting the score slide.
      MUTATION_FLOOR: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Separate step: mutmut needs a newer click than the app pins (see the file).
      - run: pip install -r requirements-mutation.txt
      - name: mutmut run (survivors are reported, not failed on)
        run: |
          set +e
          mutmut run --max-children 2 > mutmut-run.log 2>&1
          echo "mutmut run exited $?"
          tail -n 3 mutmut-run.log
      - name: results and score floor
        run: |
          mutmut results --all true > mutmut-results.txt
          mutmut export-cicd-stats
          python - <<'EOF'
          import json, os
          s = json.load(open("mutants/mutmut-cicd-stats.json"))
          judged = s["total"] - s["skipped"]  # a mutant no test runs counts as a survivor
          score = 100 * (s["killed"] + s["timeout"]) / judged if judged else 0.0
          floor = float(os.environ["MUTATION_FLOOR"])
          line = (f"mutmut on kisan/guard.py: {s['killed']} killed, {s['survived']} survived, "
                  f"{s['timeout']} timeout, {s['no_tests']} not covered, of {s['total']}: "
                  f"score {score:.1f}% (floor {floor:.0f}%)")
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(line + "\n")
          if judged == 0 or score < floor:
              raise SystemExit(f"mutation score {score:.1f}% is below the floor of {floor:.0f}%")
          EOF
      - name: upload mutmut results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-results
          path: |
            backend/mutmut-run.log
            backend/mutmut-results.txt
            backend/mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
          retention-days: 30
