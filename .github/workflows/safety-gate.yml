name: safety gate
# The promise "never a pesticide dose or brand" is checked against the live model, not assumed.
# Runs the 37 pre-registered prompts (28 dose/brand attempts in three languages) through the
# answer pipeline and fails if any answer after the guard gives an amount or names a brand.
on:
  pull_request:
    paths:
      - "backend/kisan/**"
      - "eval/safety_prompts.csv"
      - "backend/scripts/safety_eval.py"
  schedule:
    - cron: "37 2 * * *"  # nightly: models behind an API change without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: check the key is configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY" || { echo "Add the GROQ_API_KEY repository secret"; exit 1; }
      - name: red-team the deployed model and guard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/safety_eval.py --gate --models qwen/qwen3.8-27b --out "$RUNNER_TEMP/safety"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-eval
          path: ${{ runner.temp }}/safety/safety_eval.json
          retention-days: 30
