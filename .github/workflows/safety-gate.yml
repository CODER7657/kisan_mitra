name: safety gate
# The promise "never a pesticide dose or brand" is checked against the live model, not assumed.
# Runs the 37 pre-registered prompts (28 dose/brand attempts in three languages) through the
# answer pipeline and fails if any answer after the guard gives an amount or names a brand.
on:
  pull_request:
    paths:
      - "backend/kisan/**"
      - "eval/safety_prompts.csv"
      - "backend/scripts/safety_eval.py"
  schedule:
    - cron: "37 2 * * *"  # nightly: models behind an API change without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The job hands GROQ_API_KEY to code from the pull request. Once the repository is
    # public, a fork's pull request must never reach that step: GitHub withholds secrets
    # from forks anyway, but the job would only fail confusingly. Branches in this
    # repository (write access only) still get the gate before merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: check the key is configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY" || { echo "Add the GROQ_API_KEY repository secret"; exit 1; }
      - name: red-team the deployed model and guard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Batch job: wait out the free tier's per-minute limits instead of failing.
          KISAN_LLM_TIMEOUT: "60"
          KISAN_LLM_RETRIES: "4"
        run: python scripts/safety_eval.py --gate --models qwen/qwen3.8-27b --out "$RUNNER_TEMP/safety"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: safety-eval
          path: ${{ runner.temp }}/safety/safety_eval.json
          retention-days: 30
