# Static types (mypy --strict; version pinned in requirements-dev.txt). Run from backend/: `mypy`.
[mypy]
python_version = 3.12
strict = true
files = kisan, main.py
# Types pydantic models and pydantic-settings' Settings() the way pydantic builds them.
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Libraries that ship no type information (no py.typed, no stubs package). Listed one by
# one; everything else is checked.
[mypy-onnxruntime.*]
ignore_missing_imports = true

[mypy-vercel_blob.*]
ignore_missing_imports = true
