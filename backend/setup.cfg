# mutmut (mutation testing, .github/workflows/mutation.yml): mutate only the dose/brand
# guard and judge each mutant with the guard's example and property tests.
[mutmut]
source_paths = kisan
only_mutate = kisan/guard.py
pytest_add_cli_args_test_selection =
    tests/test_guard.py
    tests/test_guard_properties.py
also_copy =
    pytest.ini
